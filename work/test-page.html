<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local English Refiner test</title>
    <style>
      body { max-width: 760px; margin: 60px auto; padding: 0 24px; color: #172033; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fb; }
      main { padding: 32px; border: 1px solid #e2e7ef; border-radius: 20px; background: white; box-shadow: 0 14px 40px rgba(31, 41, 55, .08); }
      h1 { margin-top: 0; }
      label { display: block; margin: 22px 0 8px; font-weight: 650; }
      input, textarea, [contenteditable] { width: 100%; border: 1px solid #b7c0ce; border-radius: 12px; padding: 14px 48px 14px 14px; font: inherit; background: white; }
      textarea { min-height: 150px; resize: vertical; }
      [contenteditable] { min-height: 90px; }
    </style>
  </head>
  <body>
    <main>
      <h1>English Refiner test page</h1>
      <p>Focus a field to display the refinement button.</p>
      <label for="subject">Subject</label>
      <input id="subject" value="Here is informations for you">
      <label for="message">Message</label>
      <textarea id="message">Hi teams, here is the quick update for the code change notifications.</textarea>
      <label for="rich">Editable message</label>
      <div id="rich" contenteditable="true">I have already completed part one and it work correctly.</div>
    </main>
    <script src="test-page.js"></script>
    <script src="../extension/content.js"></script>
  </body>
</html>
